name: Regenerate Procedural Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dynamic-webs-procedural-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-assets:
    name: Rebuild and commit procedural assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out the triggering branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/asset_generation/requirements.txt

      - name: Install generator dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement tools/asset_generation/requirements.txt
          python --version
          python -m pip freeze

      - name: Delete all previously generated asset directories
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          assets_root = Path("assets")
          generated_directories = sorted(
              path
              for path in assets_root.rglob("generated")
              if path.is_dir()
          )

          if not generated_directories:
              print("No existing generated asset directories were found.")

          for directory in generated_directories:
              print(f"Deleting {directory}")
              shutil.rmtree(directory)
          PY

      - name: Regenerate every procedural asset and preview
        shell: bash
        run: |
          python tools/asset_generation/run_all_asset_generators.py

      - name: Run every asset validator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          directory = Path("tools/asset_generation")
          validators = sorted(
              path
              for path in directory.glob("validate_*.py")
              if path.is_file()
          )

          if not validators:
              raise SystemExit(
                  "No validate_*.py asset validators were found."
              )

          print(f"Discovered {len(validators)} asset validators:")
          for validator in validators:
              print(f"  - {validator.name}")

          for validator in validators:
              print()
              print("=" * 78)
              print(f"Running {validator.name}")
              print("=" * 78)
              subprocess.run(
                  [sys.executable, str(validator)],
                  check=True,
              )
          PY

      - name: Confirm generated outputs exist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manifests = sorted(Path("assets").glob("*/generated/manifest.json"))
          webps = sorted(Path("assets").glob("*/generated/*.webp"))

          if not manifests:
              raise SystemExit("No generated asset manifests were produced.")

          if not webps:
              raise SystemExit("No generated WebP assets were produced.")

          print(f"Generated manifests: {len(manifests)}")
          print(f"Generated WebP files: {len(webps)}")
          PY

      - name: Commit regenerated assets
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add --all assets

          if git diff --cached --quiet; then
            echo "The regenerated assets are byte-for-byte unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "chore: regenerate procedural web assets" \
            -m "Generated on a GitHub-hosted runner from source commit ${SOURCE_COMMIT}." \
            -m "Workflow run: https://github.com/${REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}"

          git push origin "HEAD:${TARGET_BRANCH}"
